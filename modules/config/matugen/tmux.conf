# Generated by matugen from the DMS wallpaper — do not edit.
# Rendered from modules/config/matugen/tmux.conf via ~/.config/matugen/config.toml.
# Sourced by tmux.conf (source-file -q), so it overrides the static Graphite
# block there — which stays as the macOS and pre-first-run fallback.

set -g status-style "bg=default,fg={{colors.on_surface.default.hex}}"

# status-left/right embed their colours inline, so *-style cannot reach them;
# they have to be restated here in full or half the bar stays on the old palette.
set -g status-left "#[fg={{colors.primary.default.hex}},bold] #S #[fg={{colors.outline.default.hex}}]│ "
set -g status-right "#(~/Scripts/tmux-battery) #[fg={{colors.outline.default.hex}}]│ #[fg={{colors.outline.default.hex}}]#{b:pane_current_path} #[fg={{colors.outline.default.hex}}]│ #[fg={{colors.primary.default.hex}}]%H:%M"

set -g window-status-style "fg={{colors.outline.default.hex}},bg=default"
set -g window-status-current-style "fg={{colors.primary.default.hex}},bg=default,bold"

set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

set -g message-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g message-command-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g mode-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"

set -g clock-mode-colour "{{colors.primary.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.outline_variant.default.hex}}"
