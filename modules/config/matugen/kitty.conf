# Generated by matugen from the DMS wallpaper — do not edit.
# Rendered from modules/config/matugen/kitty.conf via ~/.config/matugen/config.toml.
#
# Hybrid on purpose. The surface roles below track the wallpaper, but the 16
# ANSI colours do NOT: matugen derives its dank16 ramp from the primary
# independently of matugenScheme, so even on scheme-neutral it lands on
# #f06c96 red / #68d174 green -- fine for a bar, far too loud for a terminal
# you read all day. These stay the muted Graphite ramp instead.
#
# herdr inherits this file (theme.name = "terminal"), so it stays muted too.

# Light mode does not use `background`: on scheme-neutral that is #fbf9fa,
# near paper-white and tiring to read all day. surface_dim is a soft grey, and
# the selection moves to outline_variant so it still shows against it.
<* if {{ is_dark_mode }} *>
background            {{colors.background.default.hex}}
cursor_text_color     {{colors.background.default.hex}}
selection_background  {{colors.surface_container_high.default.hex}}
<* else *>
background            {{colors.surface_dim.default.hex}}
cursor_text_color     {{colors.surface_dim.default.hex}}
selection_background  {{colors.outline_variant.default.hex}}
<* endif *>
foreground            {{colors.on_surface.default.hex}}
cursor                {{colors.primary.default.hex}}
selection_foreground  {{colors.on_surface.default.hex}}
url_color             {{colors.primary.default.hex}}

<* if {{ is_dark_mode }} *>
# ── static muted ANSI ramp ──────────────────────────────────────────────────
# normal
color0   #1c1c20
color1   #b56b6b
color2   #7d9a6b
color3   #c2a15c
color4   #6f8fb3
color5   #8c7da0
color6   #6fa3a3
color7   #a8a8b0
# bright
color8   #4a4a52
color9   #c47f7f
color10  #8fab7c
color11  #d4b36e
color12  #84a1c4
color13  #9d8eb0
color14  #80b3b3
color15  #c6c6cd
<* else *>
# ── static muted ANSI ramp, light ───────────────────────────────────────────
# The same hues, darkened until each clears 3.5:1 on surface_dim (half of them
# 4.5:1). The dark ramp scores 1.2-2.8:1 there. color7/color15 ("white") become
# dark greys, as in any light terminal theme -- programs print them as text.
# normal
color0   #1c1c20
color1   #943c3c
color2   #4a6639
color3   #7a5a18
color4   #3a5a80
color5   #64507e
color6   #356a6a
color7   #4a4a52
# bright
color8   #66666f
color9   #a34646
color10  #557543
color11  #8a6a22
color12  #456a96
color13  #735f8f
color14  #407a7a
color15  #2a2a30
<* endif *>
