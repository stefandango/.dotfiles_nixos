# Generated by matugen from the DMS wallpaper — do not edit.
# Rendered from modules/config/matugen/kitty.conf via ~/.config/matugen/config.toml.
#
# Hybrid on purpose. The surface roles below track the wallpaper, but the 16
# ANSI colours do NOT: matugen derives its dank16 ramp from the primary
# independently of matugenScheme, so even on scheme-neutral it lands on
# #f06c96 red / #68d174 green -- fine for a bar, far too loud for a terminal
# you read all day. These stay the muted Graphite ramp instead.
#
# herdr inherits this file (theme.name = "terminal"), so it stays muted too.

background            {{colors.background.default.hex}}
foreground            {{colors.on_surface.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.background.default.hex}}
selection_background  {{colors.surface_container_high.default.hex}}
selection_foreground  {{colors.on_surface.default.hex}}
url_color             {{colors.primary.default.hex}}

# ── static muted ANSI ramp ──────────────────────────────────────────────────
# normal
color0   #1c1c20
color1   #b56b6b
color2   #7d9a6b
